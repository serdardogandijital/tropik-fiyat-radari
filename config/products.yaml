#   variant  : sayfada birden çok seçenek varsa eşleşecek metin (ör. "1 kg", "10 Adet")
#   own: true: bizim sitemiz (Tropik Hasat / Bizim Tropikal)
# Yeni rakip eklemek için ilgili ürünün altına bir satır kopyalamak yeterli.

