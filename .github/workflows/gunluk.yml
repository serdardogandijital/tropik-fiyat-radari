name: Günlük fiyat taraması
on:
  schedule:
    - cron: "17 4 * * *"   # her gün 07:17 (TR saati)
  workflow_dispatch: {}     # elle çalıştırma butonu
permissions:
  contents: write
jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_URL: ${{ vars.PANEL_URL }}
      - name: Veriyi kaydet
        run: |
          git config user.name "fiyat-radari"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git commit -m "Fiyatlar $(date +%F)" || echo "değişiklik yok"
          git push
